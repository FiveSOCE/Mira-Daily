name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraDaily-0.1.2
          path: build/libs/MiraDaily-0.1.2.jar
          if-no-files-found: error

      - name: Publish v0.1.2 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.2 >/dev/null 2>&1; then
            gh release create v0.1.2 \
              build/libs/MiraDaily-0.1.2.jar \
              --target "${{ github.sha }}" \
              --title "MiraDaily v0.1.2" \
              --notes "Final merged Daily expansion: timezone-safe claims, working claim/streak commands, best-streak and total-claim statistics, bounded claim history, earned streak protection, MiraCore milestones/audit, rich claim events, reward previews and MiraLeaderboards publishing."
          fi
