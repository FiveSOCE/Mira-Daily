name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 79cedb7f4a5bf7cafaf8e12ca59725ef450bc86d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle clean build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraDaily v0.1.0
          target_commitish: 79cedb7f4a5bf7cafaf8e12ca59725ef450bc86d
          body: Initial MiraDaily release with a 30-day calendar, claim streaks, configurable command rewards, streak protection, PlaceholderAPI and public ServicesManager API.
          files: build/libs/MiraDaily-0.1.0.jar
