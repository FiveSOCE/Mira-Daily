name: MiraDaily
version: ${version}
main: com.mira.daily.MiraDailyPlugin
api-version: '1.21'
author: FiveS
softdepend: [PlaceholderAPI]
commands:
  daily:
    description: Open daily rewards
    usage: /daily
  mdaily:
    description: Manage MiraDaily
    usage: /mdaily <protection|reset|reload>
permissions:
  miradaily.admin:
    default: op
