name: MiraDaily
version: ${version}
main: com.mira.daily.MiraDailyPlugin
api-version: '1.21'
author: FiveS
description: Daily reward calendar, streaks and milestone integration for the Mira ecosystem.
depend: [MiraCore]
softdepend: [PlaceholderAPI, MiraLeaderboards]
commands:
  daily:
    description: Open or use daily rewards.
    usage: /daily [claim|streak]
  mdaily:
    description: Manage MiraDaily.
    usage: /mdaily <protection|reset|reload|status>
permissions:
  miradaily.use:
    default: true
  miradaily.admin:
    default: op
